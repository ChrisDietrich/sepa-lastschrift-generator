name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name SEPA-Lastschrift-Generator gui.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SEPA-Lastschrift-Generator-${{ matrix.os }}
          path: dist/*
