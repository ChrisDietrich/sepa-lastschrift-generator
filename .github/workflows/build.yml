name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: SEPA-Lastschrift-Generator-Windows.exe
          - os: macos-latest
            asset_name: SEPA-Lastschrift-Generator-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name SEPA-Lastschrift-Generator gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/SEPA-Lastschrift-Generator.exe "${{ matrix.asset_name }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/SEPA-Lastschrift-Generator.app "${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: "Release 'latest' aktualisieren"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Aktuelle Version" \
            --notes "Automatisch gebaut aus dem main-Branch (Commit ${{ github.sha }})."

      - name: "Versionierten Release erstellen"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
